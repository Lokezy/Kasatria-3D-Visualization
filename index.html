<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Kasatria 3D Visualization
    </title>

</head>

<body>

    <!-- ============================= -->
    <!-- LOGIN SCREEN -->
    <!-- ============================= -->

    <div id="loginScreen">

        <div class="login-ambient" aria-hidden="true">
            <span class="orb orb-one"></span>
            <span class="orb orb-two"></span>
            <span class="wireframe wireframe-left"></span>
            <span class="wireframe wireframe-right"></span>
        </div>

        <main class="login-box" aria-label="Kasatria sign in">
            <span class="eyebrow">KASATRIA 3D VISUALIZATION</span>
            <h1>Welcome back.</h1>
            <p class="login-copy">Sign in to explore your people and data in a new dimension.</p>

            <button id="loginButton" type="button">
                <span class="google-g" aria-hidden="true">G</span>
                <span>Sign in with Google</span>
                <span class="button-arrow" aria-hidden="true">&#8594;</span>
            </button>

            <p id="loginStatus" role="status"></p>
            <p class="signin-note">Secure sign-in powered by Google</p>
        </main>

    </div>

    <!-- 3D APPLICATION -->
    <div id="app"></div>

    <!-- LAYOUT BUTTONS -->
    <div id="controls">

      <button id="tableButton">
        TABLE
      </button>

      <button id="sphereButton">
        SPHERE
      </button>

      <button id="helixButton">
        HELIX
      </button>

      <button id="gridButton">
        GRID
      </button>

    </div>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script
        type="module"
        src="/src/main.js"
    ></script>

</body>

</html>
